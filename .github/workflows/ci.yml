name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: opentunnel_test
          POSTGRES_PASSWORD: opentunnel
          POSTGRES_USER: opentunnel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opentunnel -d opentunnel_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      OPENTUNNEL_TEST_DATABASE_URL: postgres://opentunnel:opentunnel@localhost:5432/opentunnel_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            backend/go.sum
            cli/go.sum
            shared/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Verify generated contracts
        run: |
          make generate
          git diff --exit-code
      - name: Frontend checks
        working-directory: frontend
        run: |
          bun run typecheck
          bun run build
      - name: Go tests
        run: go test -race ./backend/... ./cli/... ./shared/...
      - name: Go build
        run: go build ./backend/cmd/server ./cli/cmd/opentunnel
      - name: Check installer scripts
        run: sh -n scripts/install.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --check -f backend/Dockerfile .
      - run: docker build --check -f frontend/Dockerfile frontend
      - run: docker build -t opentunnel-server:test -f backend/Dockerfile .
      - run: docker build -t opentunnel-frontend:test -f frontend/Dockerfile frontend
