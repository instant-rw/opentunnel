server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html _shell.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Serve the prerendered landing page for crawlers and first paint.
    location = / {
        try_files /index.html /_shell.html;
    }

    location / {
        try_files $uri $uri/ /_shell.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
