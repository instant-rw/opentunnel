services:
  server:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://opentunnel:opentunnel@postgres:5432/opentunnel?sslmode=disable
      OPENTUNNEL_BASE_URL: ${OPENTUNNEL_BASE_URL:-http://localhost:8080}
      OPENTUNNEL_HTTP_ADDR: :8080
      OPENTUNNEL_LOG_LEVEL: ${OPENTUNNEL_LOG_LEVEL:-info}
      OPENTUNNEL_PUBLIC_HOST: ${OPENTUNNEL_PUBLIC_HOST:-localhost}
      OPENTUNNEL_SECURE_COOKIES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opentunnel
      POSTGRES_PASSWORD: opentunnel
      POSTGRES_USER: opentunnel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentunnel -d opentunnel"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - opentunnel-postgres:/var/lib/postgresql/data

volumes:
  opentunnel-postgres:
